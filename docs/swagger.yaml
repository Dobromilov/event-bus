  models.Appointment:
    properties:
      client:
        type: string
      created_at:
        type: string
      id:
        type: integer
      service:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Beauty salon appointment management service
  title: Beauty Salon Event Bus API
  version: "1.0"
paths:
