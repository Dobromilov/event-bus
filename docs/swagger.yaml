            type: array
      summary: List appointments
      tags:
      - appointments
    post:
      consumes:
      - application/json
      parameters:
      - description: appointment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.CreateAppointmentRequest'
