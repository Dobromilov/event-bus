    get:
      parameters:
      - description: appointment id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Appointment'
      summary: Get appointment by id
      tags:
      - appointments
  /appointments/{id}/complete:
    post:
      parameters:
      - description: appointment id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
